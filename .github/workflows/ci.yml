name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Weekly, so a new Obsidian rule is caught even when nothing is pushed.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # npm ci, as the community review bot installs: it fails if
      # package-lock.json has drifted from package.json.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting (Prettier)
        run: npm run format:check

      # Lint with the newest Obsidian ruleset, not just the version in the
      # lockfile: the review bot uses the current release, so a new rule
      # should fail here first.
      - name: Use the latest Obsidian ESLint rules
        run: |
          npm install --no-save eslint-plugin-obsidianmd@latest
          echo "eslint-plugin-obsidianmd $(node -p "require('eslint-plugin-obsidianmd/package.json').version")"

      - name: Lint (ESLint + Obsidian plugin rules)
        run: npx eslint . --max-warnings=0

      - name: Lint as the review bot does (obsidianmd recommended only)
        run: npx eslint . -c eslint.review.config.mjs --max-warnings=0

      - name: Test
        run: npm test

      - name: Build
        run: npm run build --if-present
